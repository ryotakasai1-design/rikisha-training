<style>
:root{--bg:#fbfaf8;--card:#fff;--line:#e6e1da;--red:#c8161d;--red2:#a30f15;--ink:#1a1717;--sub:#6f6660}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;min-height:100vh;line-height:1.8}
header{background:#fff;color:var(--ink);text-align:center;padding:34px 16px 26px;border-bottom:1px solid var(--line);position:relative;animation:fade 1s both}
header::after{content:"";position:absolute;left:50%;bottom:-1px;width:56px;height:2px;margin-left:-28px;background:var(--red)}
.mark{display:block;width:14px;height:14px;background:var(--red);border-radius:50%;margin:0 auto 14px}
h1{font-size:clamp(1.6rem,6vw,2.2rem);letter-spacing:.4em;padding-left:.4em;font-weight:600}
header p{color:var(--sub);font-size:.8rem;letter-spacing:.35em;margin-top:2px}
main{width:100%;max-width:560px;margin:0 auto;padding:28px 16px 56px}
.view{display:none}.view.on{display:block;animation:fade .7s both}
h2{text-align:center;font-size:1.05rem;font-weight:600;letter-spacing:.25em;margin-bottom:22px;padding-bottom:12px;border-bottom:1px solid var(--line);position:relative}
h2::after{content:"";position:absolute;left:50%;bottom:-1px;width:40px;height:2px;margin-left:-20px;background:var(--red)}
.menu{display:grid;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--red);border-radius:2px;padding:18px 16px;text-align:center;color:var(--ink);font:inherit;font-size:1.08rem;letter-spacing:.1em;cursor:pointer;transition:.25s;width:100%;display:block;}
.card small{display:block;color:var(--sub);font-size:.78rem;letter-spacing:.06em;line-height:1.6}
.card:hover,.card:focus-visible{border-left-color:var(--ink);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.06);outline:none}
.menu .card{animation:fade .8s both}
.menu .card:nth-child(1){animation-delay:.1s}.menu .card:nth-child(2){animation-delay:.2s}.menu .card:nth-child(3){animation-delay:.3s}.menu .card:nth-child(4){animation-delay:.4s}.menu .card:nth-child(5){animation-delay:.5s}
.panel{background:var(--card);border:1px solid var(--line);border-top:2px solid var(--red);border-radius:2px;padding:28px 18px;text-align:center}
.count{color:var(--sub);font-size:.85rem;letter-spacing:.15em}
.q{font-size:clamp(1.15rem,4.5vw,1.45rem);margin:16px 0;min-height:4.5em;display:flex;align-items:center;justify-content:center}
.a{border-top:1px dashed var(--line);padding-top:14px;color:var(--red);font-size:1.1rem;font-weight:700;min-height:5em;opacity:0;transition:opacity .5s;white-space:pre-line}
.a.on{opacity:1}
.btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{flex:1 1 140px;padding:13px;border:1px solid var(--red);background:var(--red);color:#fff;font:inherit;letter-spacing:.1em;border-radius:3px;cursor:pointer;transition:.2s}
.btn:hover{background:var(--red2)}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--ink)}
.btn.ghost:hover{background:var(--ink);color:#fff}
.back{margin-top:20px;text-align:center}
.back button{background:none;border:none;color:var(--sub);font:inherit;cursor:pointer;letter-spacing:.1em;text-decoration:underline}
.soon{color:var(--sub);text-align:center;padding:12px}
.dl{text-align:left}
.dl div{padding:12px 4px;border-bottom:1px solid var(--line)}
.dl div:last-child{border:0}
.dl dt{color:var(--red);font-size:.8rem;letter-spacing:.15em}
.dl dd{margin:0}
.shop h3{font-size:1.3rem;letter-spacing:.1em;text-align:center;margin-bottom:6px}
.tag{display:inline-block;border:1px solid var(--red);color:var(--red);font-size:.75rem;padding:0 8px;border-radius:2px;margin-bottom:10px}
.st{list-style:none;padding:0;margin:16px 0 4px 18px;border-left:4px solid var(--red);text-align:left}
.st li{position:relative;padding:5px 0 5px 22px}
.st li::before{content:"";position:absolute;left:-11px;top:13px;width:12px;height:12px;background:#fff;border:3px solid var(--ink);border-radius:50%}
.st .cd{color:var(--red);font-size:.8rem;margin-right:8px;letter-spacing:.05em}
.st .nt{color:var(--sub);font-size:.8rem;margin-left:6px}
.line .more{display:none;margin-top:12px;font-size:1rem}
.line.open .more{display:block}
.line.open{border-left-color:var(--ink);cursor:default}
.line .btn{margin-top:10px;padding:8px 16px;flex:none}
.chk{display:flex;gap:12px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);cursor:pointer;text-align:left}
.chk input{accent-color:var(--red);width:20px;height:20px;flex:none}
.chk input:checked+span{color:var(--sub);text-decoration:line-through}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    </div>
    <div class="back"><button data-go="home">← トップへ戻る</button></div>
  </section>
</main>

// ===== 画面切り替え =====
const hooks={};
function go(id){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  if(hooks[id]) hooks[id]();
  window.scrollTo({top:0,behavior:'smooth'});
}

// ===== 一問一答（一巡するまで重複なしのランダム）=====
function makeQuiz(id,data,back,title,prefix){
  const s=document.createElement('section');s.className='view';s.id=id;
  s.innerHTML='<h2>'+title+'</h2><div class="panel"><div class="count"></div><p class="q"></p><div class="a"></div><div class="btns"><button class="btn show">回答を表示</button><button class="btn ghost next">次の問題へ</button></div></div><div class="back"><button data-go="'+back+'">← 戻る</button></div>';
  document.querySelector('main').appendChild(s);
  const $=c=>s.querySelector(c);
  let order=[],pos=0,cur=0;
  const shuffle=()=>{order=data.map((_,i)=>i);for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}pos=0;};
  const next=()=>{
    if(pos>=order.length)shuffle();
    cur=order[pos++];
    $('.count').textContent=prefix?prefix+(cur+1)+' ／ '+data.length:pos+' ／ '+data.length;
    $('.q').textContent=data[cur][0];
    $('.a').classList.remove('on');$('.a').textContent='';
  };
  $('.show').onclick=()=>{$('.a').textContent=data[cur][1];$('.a').classList.add('on');};
  $('.next').onclick=next;
  shuffle();
  hooks[id]=next;
}
makeQuiz('quiz',QA,'quizmenu','公式の132問','Q');
makeQuiz('fukuquiz',FUKUQA,'quizmenu','浅草七福神一問一答','');
makeQuiz('five',FIVE,'quizmenu','5つのメイン寺・神社一問一答','');

// ===== 浅草グルメ（種類 → 系統 → 店名 → 店情報）=====
const g={t:null,g:null,s:null};
const body=document.getElementById('gbody'),gtitle=document.getElementById('gtitle');
function btn(html,fn){const b=document.createElement('button');b.className='card';b.innerHTML=html;b.onclick=()=>{fn();renderG();window.scrollTo({top:0,behavior:'smooth'});};body.appendChild(b);}
function renderG(){
  body.innerHTML='';body.className='menu';
  if(!g.t){gtitle.textContent='浅草グルメ';
    for(const k in GOURMET)btn(GOURMET[k].name,()=>g.t=k);
  }else if(!g.g){const G=GOURMET[g.t];gtitle.textContent=G.name+'：系統を選ぶ';
    G.genres.forEach(x=>btn(x+'<small>'+G.shops.filter(s=>s.g===x).length+'店</small>',()=>g.g=x));
  }else if(!g.s){const G=GOURMET[g.t];gtitle.textContent=g.g;
    G.shops.filter(s=>s.g===g.g).forEach(s=>btn(s.n,()=>g.s=s));
  }else{const s=g.s;gtitle.textContent='店の情報';body.className='';
    body.innerHTML='<div class="panel shop"><span class="tag">'+s.g+'</span><h3>'+s.n+'</h3><dl class="dl"><div><dt>営業時間</dt><dd>'+s.h+'</dd></div><div><dt>価格帯</dt><dd>'+s.p+'</dd></div><div><dt>ガイド</dt><dd>'+s.d+'</dd></div></dl><p class="soon" style="font-size:.78rem">※営業時間・価格帯は食べログ掲載情報（変わることがあります）</p></div>';}
}
document.getElementById('gback').onclick=()=>{
  if(g.s)g.s=null;else if(g.g)g.g=null;else if(g.t)g.t=null;else{go('home');return;}
  renderG();
};
hooks.gourmet=()=>{g.t=g.g=g.s=null;renderG();};

// ===== 電車路線（路線 → 区間 → 全駅）=====
const lw=document.getElementById('lines');
LINES.forEach(L=>{
  const c=document.createElement('div');c.className='card line';c.tabIndex=0;
  c.innerHTML='<b>'+L.n+'</b><div class="more"><div>'+L.r+'</div><button class="btn ghost">路線図を表示</button><div class="map"></div></div>';
  const map=c.querySelector('.map'),b=c.querySelector('.btn');
  c.addEventListener('click',()=>c.classList.add('open'));
  b.addEventListener('click',e=>{e.stopPropagation();
    if(map.innerHTML){map.innerHTML='';b.textContent='路線図を表示';return;}
    map.innerHTML='<ul class="st">'+L.st.map(([cd,nm,nt])=>'<li>'+(cd?'<span class="cd">'+cd+'</span>':'')+nm+(nt?'<span class="nt">'+nt+'</span>':'')+'</li>').join('')+'</ul>';
    b.textContent='路線図を閉じる';});
  lw.appendChild(c);
});

document.getElementById('reset').onclick=()=>document.querySelectorAll('#check input').forEach(c=>c.checked=false);
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go);});
renderG();
